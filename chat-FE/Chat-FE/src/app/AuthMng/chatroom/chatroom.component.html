<div class="chat-container">
  <div class="chat-box">
    <h2>bonjour {{currentUser}}</h2>
    <h3>Chat Room</h3>
    <div *ngIf="messages.length === 0" class="no-messages">Aucun message</div>

    <div class="messages">
      <div *ngFor="let msg of messages" class="message">
        <strong>{{ msg.sender.username }}:</strong> {{ msg.content }}
        <span class="timestamp">{{ msg.createdAt | date:'short' }}</span>
      </div>
    </div>

    <div class="input-box">
      <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Tapez un message..." />
      <button (click)="sendMessage()">Envoyer</button>
    </div>
  </div>
</div>
