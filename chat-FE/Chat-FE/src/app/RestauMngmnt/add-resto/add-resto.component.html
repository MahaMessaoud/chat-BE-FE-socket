<div class="container mt-5">
  <h3 class="text-center text-primary fw-bold">
    <i class="bi bi-plus-circle"></i> Ajouter un Restaurant
  </h3>

  <form (submit)="addResto()" class="p-4 rounded shadow bg-light w-50 mx-auto">
    <!-- Nom -->
    <div class="mb-3">
      <label class="form-label fw-bold">Nom :</label>
      <input type="text" class="form-control border-primary" [(ngModel)]="newResto.name" name="name" required />
    </div>

    <!-- Localisation -->
    <div class="mb-3">
      <label class="form-label fw-bold">Localisation :</label>
      <input type="text" class="form-control border-success" [(ngModel)]="newResto.location" name="location" required />
    </div>

    <!-- Type de Cuisine -->
    <div class="mb-3">
      <label class="form-label fw-bold">Type de Cuisine :</label>
      <input type="text" class="form-control border-danger" [(ngModel)]="newResto.cuisine" name="cuisine" required />
    </div>

    <!-- Boutons -->
    <div class="d-flex justify-content-center gap-3">
      <button type="submit" class="btn btn-primary px-4">
        <i class="bi bi-plus-circle"></i> Ajouter
      </button>
     
    </div>
  </form>
</div>
