<div class="container mt-5">
  <h2 class="text-center mb-4 fw-bold text-primary">
    🍽️ <span class="text-dark">Liste des Restaurants</span>
  </h2>

  

  <div class="table-responsive">
    <table class="table table-hover table-bordered text-center shadow-lg rounded">
      <thead class="table-primary text-white">
        <tr>
          <th>#</th>
          <th>Nom <i class="bi bi-building"></i></th>
          <th>Localisation <i class="bi bi-geo-alt-fill"></i></th>
          <th>Type de Cuisine <i class="bi bi-fire"></i></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let resto of restaurants; let i = index">
          <td class="fw-bold text-secondary">{{ i + 1 }}</td>
          <td class="fw-bold text-primary">{{ resto.name }}</td>
          <td><i class="bi bi-geo-alt text-danger"></i> {{ resto.location }}</td>
          <td>
            <span class="badge bg-success p-2 text-uppercase">{{ resto.cuisine }}</span>
          </td>
          <td>
            <a [routerLink]="['/update-restaurant', resto._id]" class="btn btn-outline-warning btn-sm">
              <i class="bi bi-pencil-square"></i> Modifier
            </a>
            <button (click)="deleteResto(resto._id)" class="btn btn-outline-danger btn-sm ms-2">
              <i class="bi bi-trash"></i> Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
